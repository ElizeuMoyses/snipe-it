name: Release image validation
on:
  pull_request:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    name: Ubuntu image / release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Test startup failure boundaries
        run: sh scripts/qa/startup-gate.sh
      - name: Build clean source, verify exclusions and run isolated image
        run: bash scripts/qa/image-readiness.sh
